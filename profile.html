<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Profile - Aurora's Scents</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;500&display=swap"
        rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="CSS/profile.css">

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- External JavaScript -->
    <script src="Java/profile.js"></script>

    <!--Embedded CSS for specific styling-->
    <style>
        /* General Styling */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: white;
            color: black;
            margin: 0;
            padding: 0;
        }

        /* Footer */
        .footer {
            background: black;
            color: white;
            padding: 20px 0;
            text-align: center;
            font-size: 14px;
        }

        /* Links */
        a {
            text-decoration: none;
            color: black;
        }
    </style>
</head>

<body>
    <!-- HEADER + NAVBAR -->
    <header class="bg-white">
        <div class="container text-center py-3">
            <h1 class="fw-bold"><a class="nav-link" href="index.html">Aurora's Scents</a></h1>
        </div>

        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
            <div class="container">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="women.html">Women's Perfume</a></li>
                        <li class="nav-item"><a class="nav-link" href="mens.html">Men's Perfume</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="cart.html">Shopping Cart</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Log In</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- USER PROFILE SECTION -->
    <section class="profile-container">
        <div class="container text-center my-5">
            <h2 class="fw-bold">User Profile</h2>

            <form name="profilebox" method="post" action="/insert-profile">
                <div class="profile-box">
                    <img src="IMAGES/profile.jpg" alt="Profile Picture" class="profile-pic">

                    <label for="fullName">Full Name</label>
                    <input type="text"  name="full_name" id="fullName" class="input-field" placeholder="Full Name"
                        value="Full Name">

                    <label for="email">Email</label>
                    <input type="email"  name="email" id="email" class="input-field" placeholder="Email" value="Email">

                    <label for="phone">Phone Number</label>
                    <input type="tel"  name="phone" id="phone" class="input-field" placeholder="Phone"
                        value="Phone Number">
                </div>

                <div class="saved-addresses">
                    <h3 class="fw-bold">Saved Addresses</h3>

                    <label for="address1">Address 1</label>
                    <input type="text" id="address1" name="address1" class="input-field" placeholder="Address 1"
                        value="Address 1" required>

                    <label for="address2">Address 2 (Optional)</label>
                    <input type="text" id="address2" name="address2" class="input-field" placeholder="Address 2"
                        value="Address 2">
                </div>

                <button type="submit" class="btn-custom">Save Changes</button>
                <button type="button" class="btn-custom btn-orders">My Orders</button>

            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer text-center">
        <div class="container">
            <p>© 2025 Aurora's Scents. All Rights Reserved.</p>
        </div>
    </footer>
</body>

</html>
